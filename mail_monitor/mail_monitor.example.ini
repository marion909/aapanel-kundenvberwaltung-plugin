# Mail-Monitor – Beispielkonfiguration
# Kopieren nach /etc/mail_monitor.ini und mit "chmod 600" schützen
# (enthält Passwörter). Nicht im Plugin-Ordner ablegen: der wird beim Update
# ersetzt.

[general]
# Name des Servers in den Discord-Nachrichten
name = mail.example.com
state_file = /var/lib/mail_monitor/state.json
# Timeout pro Netzwerkverbindung (Sekunden)
timeout = 30
# So lange wird auf die Zustellung der Testmails gewartet (Sekunden)
wait_seconds = 240
poll_interval = 15
# Erst nach so vielen Fehlschlägen in Folge melden (filtert kurze Aussetzer)
alert_after_failures = 2
# Solange die Störung anhält, höchstens alle X Minuten erneut melden (0 = nie)
repeat_alert_minutes = 120
# Nachricht senden, wenn alles wieder funktioniert
notify_recovery = yes

[discord]
webhook_url = https://discord.com/api/webhooks/XXXXXXXX/YYYYYYYY
# optional, z. B. <@123456789012345678> (Benutzer) oder <@&987654321> (Rolle)
mention =
username = Mail-Monitor

[checks]
# Rundlauf eigener Server -> externes Postfach
outbound = yes
# Rundlauf externes Postfach -> eigener Server
inbound = yes
# Kommagetrennt host:port[:ssl|starttls|plain]. SMTP/IMAP/POP3 und die
# Verschlüsselung werden am Port erkannt (25/587 = SMTP, 465 = SMTPS, 993 = IMAPS).
ports = mail.example.com:25, mail.example.com:587, mail.example.com:993
# Warnen, wenn ein TLS-Zertifikat in weniger als X Tagen abläuft
cert_warn_days = 14
# Postfix-Warteschlange prüfen (nur wenn das Skript auf dem Mailserver läuft)
queue = yes
queue_warn = 20
queue_fail = 100
# queue_command = /usr/sbin/postqueue -p

# Ein Postfach auf DEINEM Mailserver, das nur für den Monitor genutzt wird.
[server]
address = monitor@example.com
password = geheim
smtp_host = mail.example.com
# ssl (Port 465), starttls (Port 587) oder none
smtp_security = starttls
smtp_port = 587
imap_host = mail.example.com
imap_security = ssl
imap_port = 993
folders = INBOX
# Abweichender Login, falls nicht die Adresse selbst:
# user = monitor@example.com

# Ein Postfach bei einem FREMDEN Anbieter (GMX, web.de, Gmail, Outlook ...),
# damit die Mails wirklich über das Internet laufen. Bei Gmail/Outlook ein
# App-Passwort verwenden und IMAP aktivieren.
[external]
address = mein.monitor@gmx.de
password = app-passwort
smtp_host = mail.gmx.net
smtp_security = starttls
smtp_port = 587
imap_host = imap.gmx.net
imap_security = ssl
imap_port = 993
folders = INBOX
# Landet die Testmail hier, gibt es eine Warnung (Reputation/SPF/DKIM prüfen).
# GMX: Spamverdacht | web.de: Unerwünscht | Gmail: [Gmail]/Spam
spam_folders = Spamverdacht
